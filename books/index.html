<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Charlie's latest book reviews, ratings, and reading shelves."
    />
    <title>Charlie's Books</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link rel="stylesheet" href="books.css" />
    <script src="books.js" defer></script>
  </head>
  <body>
    <nav class="topnav" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a class="active" href="/books/" aria-current="page">Books</a>
    </nav>

    <header>
      <h1>Recent Book Reviews</h1>
    </header>

    <main class="content">
      <div class="main">
        <section class="book-controls" aria-label="Find and filter reviews">
          <div class="primary-controls">
            <label class="search-control" for="book-search">
              <span>Search by title or author</span>
              <input id="book-search" type="search" autocomplete="off" />
            </label>

            <label class="sort-control" for="book-sort">
              <span>Sort</span>
              <select id="book-sort">
                <option value="newest">Newest read</option>
                <option value="oldest">Oldest read</option>
                <option value="rating">Highest rated</option>
                <option value="title">Title</option>
                <option value="author">Author</option>
              </select>
            </label>
          </div>

          <div class="shelf-filter" id="shelf-filter">
            <span class="shelf-filter-label">Shelves (match all):</span>
            <div id="shelf-buttons" class="shelf-buttons"></div>
            <button id="clear-filter" type="button">clear filters</button>
          </div>
        </section>

        <p id="result-count" role="status" aria-live="polite">Loading reviews…</p>
        <p id="no-results" hidden>No books match your current search and shelves.</p>
        <div id="book-list"></div>

        <noscript>
          <p>This page needs JavaScript to load and filter the book reviews.</p>
        </noscript>

        <a class="goodreads-link" href="https://www.goodreads.com/user/show/133445889-charlie"
          >View all my books</a
        >
      </div>
    </main>
  </body>
</html>
